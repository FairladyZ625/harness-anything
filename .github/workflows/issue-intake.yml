name: issue-intake

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  require-source-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const requiredHeadings = [
              "### Issue type",
              "### Impact",
              "### Expected behavior",
              "### Actual behavior",
              "### Reproduction steps",
              "### Version / build",
              "### Command output or logs",
              "### Reporter environment",
              "### Source-level triage",
              "### Stop condition or acceptance criteria",
              "### Public issue checklist"
            ];
            const missing = requiredHeadings.filter((heading) => !body.includes(heading));
            if (missing.length === 0) return;

            const message = [
              "This issue is missing the required sections below. Edit the issue to add them; it will not be closed.",
              "",
              "Missing required sections:",
              ...missing.map((heading) => `- ${heading.replace(/^### /, "")}`),
              "",
              "Follow `skills/harness-issue/SKILL.md` in this repository to fill the canonical body."
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: message
            });
