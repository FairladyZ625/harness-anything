name: pr-body

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  # GitHub's merge queue dispatches checks_requested for the temporary merge ref.
  # Body declarations belong to each source PR, so the merge-group jobs below
  # publish a pass-through conclusion instead of inventing a synthetic body.
  merge_group:
    types: [checks_requested]

concurrency:
  group: pr-body-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required job owns the blocking body checks. The manifest runner executes every gate
  # declared for `pr-body-lint` before it decides the job verdict, so one run reports every
  # missing section or declaration instead of exposing them one at a time. The gate set comes
  # from tools/gate-manifest.json; adding a required body check is a manifest declaration here.
  pr-body-lint:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Use source PR body conclusion for the merge group
        if: github.event_name == 'merge_group'
        uses: actions/github-script@v7
        with:
          script: core.info("PR body checks were already evaluated on each queued source PR.");
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
      - uses: ./.github/actions/electron-runtime-cache
        if: github.event_name == 'pull_request'
      - run: npm ci
        if: github.event_name == 'pull_request'
      - name: Fetch the comparison base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main
      - name: Run every required PR body gate
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: node tools/run-manifest-gates.mjs --workflow-job pr-body-lint

  # Advisory body checks keep their existing non-blocking enforcement. They share one aggregate
  # job for the same reason as the required lane: every advisory gate runs and reports before the
  # job verdict, rather than letting an earlier failure hide the rest. No npm install is needed:
  # these checks only read the checkout, the event payload and the live PR body.
  pr-body-advisory:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Use source PR body conclusions for the merge group
        if: github.event_name == 'merge_group'
        uses: actions/github-script@v7
        with:
          script: core.info("Evidence and dependency declarations were already evaluated on each queued source PR.");
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          node-version: 24
      - name: Fetch the comparison base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: git fetch --no-tags origin main
      # production-delta has no body input, so the merge group measures its own combined tree.
      - name: Compute production delta for the merge group
        if: github.event_name == 'merge_group'
        env:
          PR_BASE_SHA: ${{ github.event.merge_group.base_sha || 'origin/main' }}
        run: node tools/gates/production-delta.mjs --base "$PR_BASE_SHA"
      # The Dependency-Change declaration judges the pull request as it is now, so a rerun must
      # fetch the live body instead of replaying the event payload captured at trigger time.
      - name: Fetch the live PR body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR_NUMBER" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
      - name: Run every advisory PR body gate
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: node tools/run-manifest-gates.mjs --workflow-job pr-body-advisory
