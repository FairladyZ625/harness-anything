name: pr-body

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: pr-body-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job owns every body check. The manifest runner executes all gates declared for
  # `pr-body-lint` before it decides the job verdict, so one run reports every missing section,
  # declaration or evidence claim instead of exposing them one at a time. The gate set comes from
  # tools/gate-manifest.json; adding a body check is a manifest declaration here, not a new job.
  pr-body-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Fetch the comparison base
        run: git fetch --no-tags origin main
      - name: Run every PR body manifest gate
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: node tools/run-manifest-gates.mjs --workflow-job pr-body-lint
