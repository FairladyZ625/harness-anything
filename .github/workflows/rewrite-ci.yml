name: rewrite-ci

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

env:
  # Quarantined tests (tools/test-quarantine.json) run only on the nightly schedule; PR and main-push
  # lanes skip them so a load-sensitive test cannot block merges. Every entry names its owner task.
  HARNESS_TEST_QUARANTINE: ${{ github.event_name == 'schedule' && 'run' || 'skip' }}

# Cancel superseded pull request runs (e.g. after a force-push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # dec_F5B2CBF8B45042B6DA2824A7FA/CH4: every lane used to pay its own `npm ci` (23.7
  # runner-minutes per PR across 25 lanes). This job installs once and distributes
  # node_modules and the daemon dist built by its prepare lifecycle as a tar artifact named
  # after the lockfile hash, so these install outputs are never reused across lockfile
  # contents — a different lockfile produces a different artifact name and the download fails
  # instead of silently reusing. The tar preserves workspace symlinks and packages/daemon/dist.
  # Windows lanes keep their own `npm ci` (56
  # optional native dependencies are os/cpu-scoped) and nightly lanes keep theirs (they
  # run other Node versions); pr-body-lint keeps its own too, because it lives in a
  # separate workflow whose runs race this one.
  install:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: tar -cf "$RUNNER_TEMP/node-modules.tar" node_modules packages/daemon/dist
      - uses: actions/upload-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}/node-modules.tar
          retention-days: 1

  # Push to main runs the same tiered lanes as pull_request (see below); the serial
  # aggregate survives only on the nightly schedule and manual dispatch, where a
  # single-process `npm run check` still covers shard-boundary effects the lanes
  # cannot see (and runs the Node 26 arm and scheduled quarantine).
  full-check:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: echo "npm_package_config_node_gyp_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: npm ci
      - run: git diff --check
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run check

  typecheck:
    needs: install
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: node tools/run-manifest-gates.mjs --workflow-job typecheck

  fast-contract:
    needs: install
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: git diff --check
      - run: node tools/run-manifest-gates.mjs --workflow-job fast-contract

  crlf-checkout:
    needs: install
    # Four of the reported Windows defects (#1525, #1526, #1538, #1588) are line-ending defects,
    # not platform defects: they reproduce anywhere git is told to convert. Catching them costs a
    # Linux runner and one config line, so they should never again be found by a person on Windows.
    runs-on: ubuntu-latest
    steps:
      - name: Convert line endings on checkout the way a Windows host does
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
        with:
          # The fast tier holds a ratchet that resolves its baseline from Git history, so a
          # shallow checkout fails it for a reason that has nothing to do with line endings.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: node tools/run-manifest-gates.mjs --workflow-job crlf-checkout

  windows-first-run:
    needs: install
    # platform-smoke asserts the CLI boots and refuses on a cold machine -- every command it runs
    # is expected to fail. That is why it stayed green through #1524, #1527, #1565 and #1586. This
    # job runs the product instead: init, resident daemon, publish, clone, stop. The ubuntu arm is
    # the positive control, so a red windows arm is attributable to the platform and nothing else.
    if: github.event_name == 'pull_request'
    name: windows-first-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
        if: runner.os == 'Linux'
      - run: npm run build -w @harness-anything/cli
      - run: node tools/run-manifest-gates.mjs --workflow-job windows-first-run

  integration-shard:
    needs: install
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: integration-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: node tools/run-manifest-gates.mjs --workflow-job integration-shard --shard ${{ matrix.shard }}

  windows-integration-shard:
    # The integration tier is where every POSIX host assumption lives: symlinks, deletable open
    # files, `which` and `#!/bin/sh` shims, SIGKILL kill points. #1607 fixed seven such fixtures
    # and none of their Windows branches had ever been executed anywhere. The positive control is
    # the ubuntu integration-shard job above, which runs the identical gate, so a red arm here is
    # attributable to the platform.
    # dec_630DB4EB94D3CB0B2459C8ABE2 (2026-08-20): Windows is demoted off the PR merge path.
    # The full matrix runs on the nightly schedule (and manual dispatch) only; windows-first-run
    # remains the per-PR smoke. This lane is never promoted to a required context.
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    name: windows-integration-shard (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/run-manifest-gates.mjs --workflow-job windows-integration-shard --shard ${{ matrix.shard }}

  nightly-daemon-soak:
    # Functional CI starts a small daemon, serves one client for seconds, and stops it. That shape
    # cannot catch the connection/RSS growth and handshake starvation seen on 2026-08-20/21. This
    # lane holds a 1,377-task / 26,650-event daemon under concurrent real-client load, then makes
    # one attached stream lose the daemon and proves reconnects stay bounded. It runs only on the
    # nightly schedule and manual dispatch, never on pull_request/push and never as a required context.
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The runner imports the shared hermetic preflight and applies it to the exact temporary
      # user-root and daemon id that it is about to use before it starts any daemon process.
      - name: Run hermetic daemon scale, duration, concurrency, and reconnect invariants
        env:
          HARNESS_SOAK_RESULTS_DIR: tmp/soak-results
        run: npm run test:soak
      - name: Preserve readable soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/soak-results/
          if-no-files-found: error
          retention-days: 14

  nightly-cli-command-timing:
    # Rebuilds the per-command CLI timing surface every night and holds it against the committed
    # ratio ratchet. Nothing here is a wall-clock bound: each command is divided by the same
    # compiled CLI's --help no-op measured in the same round, so a slow runner moves both arms and
    # the verdict does not move. dec_9B75595FC45E01DDFD0938FE95/CH4 lands a new lane as
    # non-required first, so this runs on the nightly schedule and manual dispatch only, never on
    # pull_request/push, and is never a required context. A red night produces the measurement
    # artifact; it does not block a merge.
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The timing ratchet compares committed limits with the immediately preceding revision.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The measured subject is the packaged CLI, not the TypeScript entry: process startup and
      # static module loading are most of what an ordinary command costs, and only the compiled
      # entry has the real ones.
      - run: npm run build -w @harness-anything/cli
      - name: Measure per-command CLI timing and enforce the committed ratio ratchet
        run: node tools/measure-cli-command-timing.mjs --out tmp/cli-command-timing/measurement.json && node tools/gates/cli-command-timing.mjs --base HEAD^ --measurement tmp/cli-command-timing/measurement.json --mode ratchet
      - name: Preserve the measurement whether or not the ratchet held
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-command-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/cli-command-timing/
          if-no-files-found: error
          retention-days: 14

  boundaries:
    needs: install
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - name: Run boundary gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/run-manifest-gates.mjs --workflow-job boundaries

  # dec_F5B2CBF8B45042B6DA2824A7FA/CH3: this lane is nightly-only now. Neither of its two
  # advisory gates ever blocked a PR (the job is continue-on-error and not a required context):
  # gui-read-baseline had zero real catches in 60 days, and allowlist-path-existence had four,
  # whose value was visibility, not blocking. Detection is preserved -- the gates stay mapped to
  # this job through nonPullRequestJobs, so the nightly schedule still runs them.
  ontology-advisory:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Report Phase G0 ontology findings
        run: node tools/run-manifest-gates.mjs --workflow-job ontology-advisory

  package-policy:
    needs: install
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      # The windows-first-run smoke (folded into this lane on push) needs the packaged bin.
      - if: github.event_name == 'push'
        run: npm run build -w @harness-anything/cli
      - run: node tools/run-manifest-gates.mjs --workflow-job package-policy

  supply-chain:
    needs: install
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: node tools/run-manifest-gates.mjs --workflow-job supply-chain

  gui-build:
    needs: install
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ""
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            gui:
              - 'packages/gui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
      - uses: actions/setup-node@v4
        if: ${{ steps.filter.outputs.gui == 'true' }}
        with:
          node-version: 24
      # Skip the GUI build/test when a PR touches no GUI or shared-root files.
      - uses: actions/download-artifact@v4
        if: ${{ steps.filter.outputs.gui == 'true' }}
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - if: ${{ steps.filter.outputs.gui == 'true' }}
        run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - if: ${{ steps.filter.outputs.gui == 'true' }}
        run: node tools/run-manifest-gates.mjs --workflow-job gui-build
  # dec_F5B2CBF8B45042B6DA2824A7FA/CH3: nightly-only now. All 25 of its real catches in 60
  # days were simultaneously caught by the Node 24 typecheck lane (exclusive catches: 0),
  # and the nightly full-check matrix already runs the aggregate under Node 26.
  node26-compatibility:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: echo "npm_package_config_node_gyp_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node tools/run-manifest-gates.mjs --workflow-job node26-compatibility

  # The jobs below merged from the retired rebuild-gates.yml workflow (one PR used to trigger
  # both workflows, each job paying its own checkout + npm ci). Job ids, steps and check names
  # are unchanged, so no required context or watch surface moves; they stay pull_request-only
  # via the guard, matching the trigger rebuild-gates.yml had after dec_6127D45D dropped its
  # push trigger. They now also join this workflow's concurrency group, so a superseded run is
  # cancelled instead of finishing on a stale SHA.
  gate-contract-tests:
    needs: install
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: node --test tools/gates/test/*.test.mjs

  derived-contracts:
    needs: install
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: node tools/gates/derived-contracts.mjs --check

  platform-smoke:
    needs: install
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: runner.os == 'Windows'
      - uses: actions/download-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
        if: runner.os == 'Linux'
      - run: npm run build -w @harness-anything/cli
      - run: node tools/gates/platform-smoke.mjs

  schema-closure:
    needs: install
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: node tools/gates/schema-closure.mjs --check

  canonical-event-compat:
    needs: install
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: npm run harness:check-canonical-event-compat

  test-selection:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Derive required test tiers
        run: |
          git fetch --no-tags origin main
          node tools/gates/test-selection.mjs --base origin/main

  clean-build:
    needs: install
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: node tools/gates/clean-build.mjs --temp

  dependency-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/gates/dependency-policy.mjs

  cost-budget:
    needs: install
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - name: Reject deterministic cost regressions (G38)
        run: node tools/gates/cost-budget.mjs

  lint:
    needs: install
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: npm run lint

  entity-id-links:
    needs: install
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: node-modules-${{ hashFiles('package-lock.json') }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/node-modules.tar"
      - run: node tools/gates/entity-id-links.mjs
