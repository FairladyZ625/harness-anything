name: event-scale

on:
  workflow_dispatch:
  schedule:
    - cron: "43 20 * * *"

permissions:
  contents: read
  actions: read

jobs:
  event-scale:
    # Report-only regression history. This workflow is separate from rewrite-ci and has no
    # branch-protection context, threshold or merge-blocking result.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore previous event-scale measurement
        uses: actions/cache/restore@v4
        with:
          path: tmp/event-scale-history/baseline.json
          key: event-scale-${{ github.sha }}-${{ github.run_id }}
          restore-keys: event-scale-
      - name: Measure canonical synthetic event scale
        run: node tools/perf/baseline-suite.mjs --out tmp/event-scale --arms kernel --sizes 217107
      - name: Compare with the previous measured commit
        run: |
          args=(--current tmp/event-scale/baseline.json --out tmp/event-scale/comparison.md)
          if [[ -f tmp/event-scale-history/baseline.json ]]; then
            args+=(--baseline tmp/event-scale-history/baseline.json)
          fi
          node tools/perf/compare-baselines.mjs "${args[@]}"
      - name: Store this commit as the next baseline
        uses: actions/cache/save@v4
        with:
          path: tmp/event-scale/baseline.json
          key: event-scale-${{ github.sha }}-${{ github.run_id }}
      - name: Preserve event-scale history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-scale-${{ github.sha }}-${{ github.run_id }}
          path: tmp/event-scale/
          if-no-files-found: error
          retention-days: 30
