name: rebuild-gates

on:
  pull_request:
    branches:
      - "main"
    types: [opened, reopened, synchronize, edited]
  pull_request_target:
    branches:
      - "main"
    types: [opened, reopened, synchronize, edited]
  push:
    branches:
      - "main"

permissions:
  contents: read

env:
  HARNESS_CI_GATE_RESULTS: tmp/ci-observation/gates.json
  HARNESS_CI_OBSERVATION_OUTPUT: tmp/ci-observation/observation.json
  HARNESS_CI_JOB: ${{ github.job }}

jobs:
  gate-contract-tests:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tools/gates/test/*.test.mjs

  derived-contracts:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/gates/derived-contracts.mjs --check

  evidence-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/gates/evidence-contract.mjs --event "$GITHUB_EVENT_PATH"

  platform-smoke:
    if: github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @harness-anything/cli
      - run: node tools/gates/platform-smoke.mjs

  schema-closure:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/gates/schema-closure.mjs --check

  canonical-event-compat:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/gates/canonical-event-compat.mjs --check

  test-selection:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Derive required test tiers
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{tree}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse origin/main)
          fi
          node tools/gates/test-selection.mjs --base "$BASE_SHA"

  clean-build:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/gates/clean-build.mjs --temp

  dependency-policy:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/gates/dependency-policy.mjs

  line-budget:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start structured CI observation timer
        run: echo "HARNESS_CI_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Enforce module line ceilings
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{tree}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse origin/main)
          fi
          node tools/gates/line-budget.mjs --base "$BASE_SHA"
      - name: Finalize structured CI observation artifact
        if: always()
        run: node tools/write-ci-observation.mjs
      - name: Upload structured CI observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-observation-${{ github.run_id }}-${{ github.run_attempt }}-G32
          path: tmp/ci-observation/observation.json
          if-no-files-found: error
          retention-days: 14

  line-density:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reject line shaving in added production code
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{tree}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse origin/main)
          fi
          node tools/gates/line-density.mjs --base "$BASE_SHA"

  cost-budget:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reject deterministic cost regressions (G37)
        run: node tools/gates/cost-budget.mjs

  production-delta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start structured CI observation timer
        run: echo "HARNESS_CI_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Verify declared production delta
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login || '' }}
        run: |
          git fetch --no-tags origin main
          gh pr view "$PR_NUMBER" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
          node tools/gates/production-delta.mjs --base origin/main --pr-body-file "$RUNNER_TEMP/pr-body.md"
      - name: Finalize structured CI observation artifact
        if: always()
        run: node tools/write-ci-observation.mjs
      - name: Upload structured CI observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-observation-${{ github.run_id }}-${{ github.run_attempt }}-G33
          path: tmp/ci-observation/observation.json
          if-no-files-found: error
          retention-days: 14

  lint:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  entity-id-links:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start structured CI observation timer
        run: echo "HARNESS_CI_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: node tools/gates/entity-id-links.mjs
      - name: Finalize structured CI observation artifact
        if: always()
        run: node tools/write-ci-observation.mjs
      - name: Upload structured CI observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-observation-${{ github.run_id }}-${{ github.run_attempt }}-G37
          path: tmp/ci-observation/observation.json
          if-no-files-found: error
          retention-days: 14
