name: rebuild-gates

on:
  pull_request:
    branches:
      - "main"
    types: [opened, reopened, synchronize]
  push:
    branches:
      - "main"

permissions:
  contents: read

env:
  HARNESS_CI_GATE_RESULTS: tmp/ci-observation/gates.json
  HARNESS_CI_OBSERVATION_OUTPUT: tmp/ci-observation/observation.json
  HARNESS_CI_JOB: ${{ github.job }}

jobs:
  gate-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tools/gates/test/*.test.mjs

  derived-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node tools/gates/derived-contracts.mjs --check

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @harness-anything/cli
      - run: node tools/gates/platform-smoke.mjs

  schema-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node tools/gates/schema-closure.mjs --check

  canonical-event-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/gates/canonical-event-compat.mjs --check

  test-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Derive required test tiers
        run: |
          git fetch --no-tags origin main
          node tools/gates/test-selection.mjs --base origin/main

  clean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/gates/clean-build.mjs --temp

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/gates/dependency-policy.mjs

  line-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start structured CI observation timer
        run: echo "HARNESS_CI_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Enforce module line ceilings
        run: |
          git fetch --no-tags origin main
          node tools/gates/line-budget.mjs --base origin/main
      - name: Finalize structured CI observation artifact
        if: always()
        run: node tools/write-ci-observation.mjs
      - name: Upload structured CI observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-observation-${{ github.run_id }}-${{ github.run_attempt }}-G32
          path: tmp/ci-observation/observation.json
          if-no-files-found: error
          retention-days: 14

  line-density:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reject line shaving in added production code
        run: |
          git fetch --no-tags origin main
          node tools/gates/line-density.mjs --base origin/main

  cost-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reject deterministic cost regressions (G37)
        run: node tools/gates/cost-budget.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  entity-id-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start structured CI observation timer
        run: echo "HARNESS_CI_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: node tools/gates/entity-id-links.mjs
      - name: Finalize structured CI observation artifact
        if: always()
        run: node tools/write-ci-observation.mjs
      - name: Upload structured CI observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-observation-${{ github.run_id }}-${{ github.run_attempt }}-G37
          path: tmp/ci-observation/observation.json
          if-no-files-found: error
          retention-days: 14
