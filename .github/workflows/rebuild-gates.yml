name: rebuild-gates

on:
  pull_request:
    branches:
      - "rebuild/**"
    types: [opened, reopened, synchronize, edited]
  pull_request_target:
    branches:
      - "rebuild/**"
    types: [opened, reopened, synchronize, edited]
  push:
    branches:
      - "rebuild/**"

permissions:
  contents: read

jobs:
  gate-contract-tests:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tools/gates/test/*.test.mjs

  derived-contracts:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/gates/derived-contracts.mjs --check

  evidence-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/gates/evidence-contract.mjs --event "$GITHUB_EVENT_PATH"

  platform-smoke:
    if: github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @harness-anything/cli
      - run: node tools/gates/platform-smoke.mjs

  schema-closure:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/gates/schema-closure.mjs --check

  test-selection:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Derive required test tiers
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{tree}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse origin/rebuild/main)
          fi
          node tools/gates/test-selection.mjs --base "$BASE_SHA"

  clean-build:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/gates/clean-build.mjs --temp

  dependency-policy:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/gates/dependency-policy.mjs

  line-budget:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enforce module line ceilings
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{tree}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse origin/rebuild/main)
          fi
          node tools/gates/line-budget.mjs --base "$BASE_SHA"

  production-delta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify declared production delta
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/gates/production-delta.mjs --base "$BASE_SHA"

  lint:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  anti-entropy-review:
    if: github.event_name == 'pull_request_target'
    # A9 removes non-blocking only after dogfood evidence and ruleset promotion.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Fetch PR head tree as untrusted data
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify anti-entropy token with base-side gate
        env:
          ANTI_ENTROPY_HMAC_KEY: ${{ secrets.ANTI_ENTROPY_HMAC_KEY }}
        run: node tools/gates/anti-entropy-review.mjs --event "$GITHUB_EVENT_PATH"
