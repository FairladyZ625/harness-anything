name: Source-triaged issue
description: Report a bug, documentation gap, or scoped improvement with source-level triage.
title: "[Issue]: "
body:
  - type: markdown
    attributes:
      value: |
        Public issues must include source-level triage. Do not assume maintainers can run the same OS, shell, filesystem, toolchain, or agent runtime as the reporter. If a required section is missing, the issue intake workflow leaves a comment listing it; the issue stays open for you to edit.
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue type
      description: Choose the closest public intake category.
      options:
        - Bug
        - Documentation gap
        - Scoped improvement
        - Failing command or CI lane
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Say who is affected, how often it happens, what breaks, whether a workaround exists, and how wide the blast radius is.
      placeholder: |
        - Who is affected:
        - How often:
        - What breaks:
        - Workaround:
        - Blast radius:
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen?
      placeholder: The command should...
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What happened instead?
      placeholder: The command exits with...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Start from a clean source checkout when possible, and include the exact command and exit code.
      placeholder: |
        1. Check out commit ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version / build
      description: Record versions only in this section. Put OS and shell details in Reporter environment.
      placeholder: |
        - `ha --version`:
        - Daemon build/commit (`ha daemon status`, field `commit=`):
        - Repository branch or commit:
        - npm package version (if this is a package):
        - Agent/runtime version:
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording
      description: "Optional. Add visible evidence only when one exists; leave this section out when the finding has no visible surface. Text evidence belongs in Command output or logs."
    validations:
      required: false
  - type: textarea
    id: command-output
    attributes:
      label: Command output or logs
      description: Include the exact command, exit code, and the smallest relevant stdout/stderr or log excerpt. Redact secrets.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Reporter environment
      description: Include OS, shell, Node version, package manager, branch or commit, and any agent/runtime involved.
      placeholder: |
        - OS:
        - Shell:
        - Node:
        - Package manager:
        - Branch/commit:
        - Agent/runtime:
    validations:
      required: true
  - type: textarea
    id: source-triage
    attributes:
      label: Source-level triage
      description: In one section, write all five parts — (1) which public files, functions, schemas, contracts, generated artifacts, or docs you read, using repository-relative paths; (2) the source-level hypothesis — which data flow, path handling, command contract, platform assumption, or validation rule is failing; (3) which file, function, validation rule, or test to investigate first; (4) which checks you ran; (5) which checks you did not run and why. Use repository-relative paths and redact secrets.
      placeholder: |
        Read:
        - ...
        Hypothesis:
        - ...
        Investigate first:
        - ...
        Checks run:
        - ...
        Checks not run / why:
        - ...
    validations:
      required: true
  - type: textarea
    id: stop-condition
    attributes:
      label: Stop condition or acceptance criteria
      description: What observable condition means this issue is fixed, or what maintainer decision is needed before implementation?
      placeholder: The issue is fixed when ...
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Public issue checklist
      options:
        - label: I removed secrets, credentials, private harness records, absolute local paths, and local-only generated caches.
          required: true
        - label: I included source-level triage instead of only asking maintainers to recreate my environment.
          required: true
        - label: I stated the affected users, frequency, and blast radius in Impact.
          required: true
