name: Cache the Electron runtime
description: >-
  Restore the @electron/get download cache keyed by the locked Electron version and prime it
  with one bounded-retry download, so npm installs and Electron launches never depend on a
  single github.com/electron/electron/releases request.

# Every job that installs dependencies or executes an Electron-importing suite uses this
# action. `tools/check-electron-ci-cache.mjs` fails the boundaries lane when a workflow job
# needs Electron but omits the action, or places it after the command that needs the cache.
runs:
  using: composite
  steps:
    - name: Point Electron's installer at the shared cache directory
      shell: bash
      run: echo "electron_config_cache=$HOME/.cache/electron" >> "$GITHUB_ENV"
    - name: Resolve the locked Electron version
      id: electron-version
      shell: bash
      run: echo "version=$(node tools/ci/electron-runtime.mjs --version)" >> "$GITHUB_OUTPUT"
    - name: Restore the Electron download cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/electron
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron-version.outputs.version }}
    - name: Download the Electron runtime once with bounded retries
      shell: bash
      run: node tools/ci/electron-runtime.mjs