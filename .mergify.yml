queue_rules:
  - name: default
    merge_method: merge
    branch_protection_injection_mode: queue
    queue_conditions:
      - base = main
      - label = merge-queue
      - "-draft"
      - "-conflict"
      - "#check-failure = 0"
    merge_conditions: []

pull_request_rules:
  - name: merge via queue when CI passes
    conditions:
      - base = main
      - label = merge-queue
    actions:
      queue:
        name: default

  - name: requeue dequeued pull requests after checks recover
    conditions:
      - base = main
      - label = merge-queue
      - label = dequeued
      - "#check-failure = 0"
      - "#check-pending = 0"
    actions:
      queue:
        name: default
      label:
        remove:
          - dequeued
