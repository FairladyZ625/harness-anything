# Node 仓库：本地命令检查 lint；PR 上的 hosted CI 由 GitHub 在合并时判定。
# lint 是自定义 gate id，需要 preset 在 profile completionGates 里声明
#   （见 skills/preset-creator/SKILL.md），否则映射惰性。
# 预期行为：lint 在 submit/complete 前于提交沙箱里跑 `npm ci && npm run lint`，非零退出阻塞 complete；
# 代码交付的合入要求由 delivery.requireMerged 与目标分支设置决定。
schema: harness-anything/v1
settings:
  gates:
    lint:
      appliesTo: code
      adapter: local-command
      command: npm ci && npm run lint
