# Python 仓库：无 GitHub CI，测试全部本地命令见证。
# settings.ci.workflows 为空时 preset 不给任务声明 ci 门，因此这里不映射 ci；
# tests 是自定义 gate id，需要 preset 在 profile completionGates 里声明。
# 命令在全新沙箱（无 HOME 等父环境）里跑：先建 venv、装依赖（含 [test] extras）、再跑 pytest。
# 预期行为：submit/complete 前自动采集；pytest 退出码 0 = pass，非零 = fail 并以
# invalid_proof 阻塞 complete；命令超过 10 分钟 = witness_unavailable（证据不可得）。
schema: harness-anything/v1
settings:
  ci:
    workflows: []
  gates:
    tests:
      appliesTo: code
      adapter: local-command
      command: python3 -m venv .venv && .venv/bin/pip install -e ".[test]" && .venv/bin/pytest -q
