# 纯文档仓：交付物是任务包 artifacts（artifact-only cut，无交付 commit）。
# local-command 需要 commit cut，artifact-only 交付上会报 witness_unavailable，
# 因此人工审阅用 manual-attest；appliesTo: artifacts 只在 cut 带已接受 artifact 锚时生效。
# review-signoff 是自定义 gate id，需要 preset 在 profile completionGates 里声明。
# 预期行为：submit 后审阅者执行
#   ha task attest <task-id> --gate review-signoff --result pass
# 代码门在此类 cut 上记 not_applicable，不阻塞。
schema: harness-anything/v1
settings:
  ci:
    workflows: []
  gates:
    review-signoff:
      appliesTo: artifacts
      adapter: manual-attest
