# Rust 仓库：cargo test 本地命令见证（cargo-test 为自定义 gate id，需 preset 声明）。
# 沙箱没有 HOME：显式把 CARGO_HOME 指到沙箱内，注册表与缓存每次重建（有依赖时
# 每次重新下载，10 分钟超时内放不下就拆 gate 或给命令减负）。
# --locked 要求 Cargo.lock 已提交；沙箱跑的是精确提交内容，未提交的 lock 改动不参与。
# 预期行为：cargo 非零退出（编译错误、测试失败、lock 过期）= fail 并阻塞 complete。
schema: harness-anything/v1
settings:
  ci:
    workflows: []
  gates:
    cargo-test:
      appliesTo: code
      adapter: local-command
      command: export CARGO_HOME="$PWD/.cargo-home" && cargo test --locked
