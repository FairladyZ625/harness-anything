# 治理字段示例：本地 e2e 门特批。
# - e2e 门挂 allowOverride：e2e 是自定义 gate id，需 preset 在 profile
#   completionGates 里声明。自动 fail 会作为正式回执落库，任务 owner 可特批：
#   ha task attest <task-id> --gate e2e --result pass --mode override --rationale "<至少 10 字符的理由>"
#   本 cut 无任何自动回执时同样可特批（waivedReceiptId 记 null）；
#   之后到达的任何自动回执都使旧特批失效，override 永远不算 signoff。
# - manual-attest 与 none 不能声明 allowOverride。
schema: harness-anything/v1
settings:
  gates:
    e2e:
      appliesTo: code
      adapter: local-command
      command: npm ci && npm run e2e
      allowOverride: true
